<div id="menu-backdrop" class="side-menu-backdrop"
     _="on click remove .open from #side-menu then remove .open from me"></div>

<aside id="side-menu" class="side-menu">
  <div class="side-menu-header">
    <span class="brand">
      <svg class="brand-bolt" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 14h6L9 22l8.5-12h-6L13 2z"/></svg>
      electro
    </span>
    <button class="side-menu-close" aria-label="Cerrar menú"
            _="on click remove .open from #side-menu then remove .open from #menu-backdrop">×</button>
  </div>

  {% if ctx.user.is_superadmin %}
  <div class="side-menu-section">
    <div class="side-menu-section-title">Administración</div>
    <a href="/sa/" class="side-menu-item">Dashboard</a>
    <a href="/sa/municipios/" class="side-menu-item">Municipios</a>
  </div>
  {% else %}
  <div class="side-menu-section">
    <div class="side-menu-section-title">Padrón</div>
    <a href="/app/padron/" class="side-menu-item">Viviendas</a>
    <a href="/app/comunidades/" class="side-menu-item">Comunidades</a>
    <a href="/app/referentes/" class="side-menu-item">Referentes</a>
  </div>
  <div class="side-menu-section">
    <div class="side-menu-section-title">Cobranza <small>(pendiente)</small></div>
    <a href="#" class="side-menu-item">Recibos</a>
    <a href="#" class="side-menu-item">Pagos</a>
    <a href="#" class="side-menu-item">Caja</a>
  </div>
  <div class="side-menu-section">
    <div class="side-menu-section-title">Configuración</div>
    <a href="/app/cuenta/cambiar-clave" class="side-menu-item">Mi clave</a>
  </div>
  {% endif %}

  <div class="theme-toggle"
       _="on click call electroTheme.toggle()">
    <span>Tema atenuado</span>
    <span class="theme-toggle-switch" aria-hidden="true"></span>
  </div>

  <div class="side-menu-section">
    <form method="post" action="/logout" class="logout-form" style="padding: 10px var(--space-4)">
      {% include 'components/csrf_input.html' %}
      <button type="submit" class="btn btn--ghost btn--block">Salir</button>
    </form>
  </div>
</aside>
