{% extends 'base.html' %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-card">
    <h1 class="auth-title">electro</h1>
    <p class="auth-subtitle">Inicia sesión para continuar</p>

    <form method="post" action="/login" class="form">
      {% include 'components/csrf_input.html' %}

      <label class="form-field">
        <span class="form-label">Usuario o DNI</span>
        <input type="text" name="usuario" required autofocus autocomplete="username"
          value="{{ usuario_value or '' }}">
      </label>

      <label class="form-field">
        <span class="form-label">Contraseña</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>

      <button type="submit" class="btn btn--primary btn--block">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
