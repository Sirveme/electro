<div id="modal-reactivar" class="modal-inline hidden">
  <div class="modal-inline-card">
    <h2>Reactivar vivienda <code>{{ vivienda.codigo_interno }}</code></h2>
    <p class="muted">
      La vivienda volverá al estado activo. Los moradores e inventario
      <strong>NO se reactivan automáticamente</strong> — debes hacerlo manualmente
      si corresponde.
    </p>

    <form method="post"
          action="/app/padron/{{ vivienda.codigo_interno }}/reactivar"
          class="form"
          id="form-reactivar-vivienda">
      {% include 'components/csrf_input.html' %}

      <label for="motivo-reactivar">
        Motivo de la reactivación
        <span class="muted small">(mínimo 10 caracteres)</span>
      </label>
      <textarea name="motivo_reactivacion" id="motivo-reactivar" rows="3"
                placeholder="Explica por qué reactivas esta vivienda" required></textarea>

      <div class="form-actions">
        <button type="button" class="btn btn--ghost"
                _="on click add .hidden to #modal-reactivar">
          Cancelar
        </button>
        <button type="submit" class="btn btn--primary" id="btn-confirmar-reactivar">
          Reactivar vivienda
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  (function () {
    var codigo = "{{ vivienda.codigo_interno }}";
    var btn = document.getElementById('btn-confirmar-reactivar');
    if (!btn) return;

    btn.addEventListener('click', async function (e) {
      e.preventDefault();
      e.stopPropagation();

      var motivo = document.getElementById('motivo-reactivar').value;
      if (motivo.trim().length < 10) {
        await window.appModal.alert(
          'Atención',
          'El motivo debe tener al menos 10 caracteres.'
        );
        return;
      }

      var ok = await window.appModal.confirm(
        'Confirmar reactivación',
        '¿Reactivar la vivienda ' + codigo + '?',
        { okText: 'Sí, reactivar', cancelText: 'No' }
      );
      if (ok === true) btn.closest('form').submit();
    });
  })();
</script>
