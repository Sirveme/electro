{# Fragmento HTMX: una fila del inventario actual de una vivienda.
   Se renderiza tras dar de baja o editar cantidad. #}
<tr data-inv-id="{{ inv.id }}">
  <td>{{ inv.artefacto_nombre_snapshot }}</td>
  <td>{{ inv.cantidad }}</td>
  <td class="muted">{{ inv.vigente_desde }}</td>
  <td>
    {% if vivienda %}
    <form method="post" action="/app/padron/{{ vivienda.codigo_interno }}/inventario/{{ inv.id }}/baja"
          hx-boost="false" style="display:inline-flex; gap:6px; align-items:center;">
      {% include 'components/csrf_input.html' %}
      <select name="motivo" required>
        {% for m in motivos_baja %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
      </select>
      <button type="submit" class="btn btn--ghost btn--sm"
        _="on click halt the event
           then call appModal.confirm('Dar de baja', '¿Confirmas la baja del artefacto?', {danger:true, okText:'Sí, dar de baja'})
           then if it then submit the closest <form/>">
        Dar de baja
      </button>
    </form>
    {% endif %}
  </td>
</tr>
