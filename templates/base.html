<!DOCTYPE html>
<html lang="es" data-theme="oscuro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}electro{% endblock %} · Perú Sistemas</title>

  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">

  <!-- Preload de estáticos críticos -->
  <link rel="preload" href="/static/css/base.css?v=2" as="style">
  <link rel="preload" href="/static/js/htmx.min.js?v=2.9.12" as="script">

  <link rel="stylesheet" href="/static/css/base.css?v=2">
  <link rel="stylesheet" href="/static/css/components.css?v=2">
  <link rel="stylesheet" href="/static/css/menu.css?v=2">

  <!-- Tema: aplicar ANTES de pintar para evitar flash -->
  <script src="/static/js/theme.js?v=2"></script>

  <script src="/static/js/htmx.min.js?v=2.9.12" defer></script>
  <script src="/static/js/_hyperscript.min.js?v=0.9.13" defer></script>
  <script src="/static/js/password_toggle.js?v=2" defer></script>
  <script src="/static/js/connection.js?v=2" defer></script>
  <script src="/static/js/kebab_close.js?v=2" defer></script>
</head>
<body hx-boost="true">

  {% if ctx and ctx.user %}
  <header class="topbar">
    <button class="menu-trigger" aria-label="Abrir menú"
            _="on click add .open to #side-menu then add .open to #menu-backdrop">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <span class="brand">
      <svg class="brand-bolt" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4.5 14h6L9 22l8.5-12h-6L13 2z"/></svg>
      electro
    </span>
    <div class="spacer"></div>
    <span class="conn-dot" title="Conexión"></span>
    <span class="conn-label"></span>
    <span class="ctx">{{ ctx.user.nombre }}</span>
  </header>

  {% include 'components/menu_lateral.html' %}
  {% endif %}

  <main class="main-content">
    {% include 'components/flash_messages.html' ignore missing %}
    {% block content %}{% endblock %}
  </main>

  {% block extra_js %}{% endblock %}
</body>
</html>
